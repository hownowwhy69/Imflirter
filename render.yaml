services:
  - type: web
    name: session-manager-pro
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      # opentele crashes on Python 3.13+ (Render default is 3.14). Pin 3.12.
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: KEEP_ALIVE_INTERVAL
        value: "45"
      - key: QT_QPA_PLATFORM
        value: "offscreen"
      - key: PYTHONUNBUFFERED
        value: "1"
        
